<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}QR Code Generator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar">
      <a class="nav-brand" href="{{ url_for('index') }}">⬛ QR Generator</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">Create</a>
        <a href="{{ url_for('list_qr') }}">My QR Codes</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>QR Code Generator &mdash; Built with Flask &amp; Python</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
